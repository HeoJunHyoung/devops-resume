# About Section
about_profile_image: images/profile.png
about_content: |
  <div class="slogan-container">
    <span class="quote-mark">“</span>
      <span class="slogan-text">지표 기반 성능 개선으로 안정성과 비용 효율을 높이는 DevOps 엔지니어</span>
    <span class="quote-mark">”</span>
  </div>

  백엔드 개발 경험을 바탕으로 애플리케이션 코드부터 클라우드 인프라까지 시스템 전반을 이해하며, 안정적이고 확장 가능한 운영 환경을 구축하는 데 관심이 있습니다.

  AWS, Kubernetes(EKS), Terraform 기반 인프라와 GitOps 자동화 배포 환경을 구축했으며, Prometheus·Grafana·k6를 활용한 성능 분석과 운영 최적화를 수행했습니다. 또한 Redis와 Kafka 기반 분산 시스템을 설계하며 데이터 일관성과 확장성을 고려한 아키텍처를 구현했습니다.
  
  문제 해결 과정과 학습 내용을 250건 이상의 기술 블로그에 기록하며 지속적으로 공유하고 있습니다.


# Content Configuration
content:
  - title: Skills
    layout: list
    content:
      - layout: left
        title: Cloud & Infrastructure
        description: |
          * **AWS:** EKS, VPC, ALB, Route53, CloudFront, S3, RDS, ElastiCache, DocumentDB
          * **IaC:** Terraform (모듈화, Remote State, DynamoDB Lock)

      - layout: left
        title: Container & GitOps
        description: |
          * **Container:** Kubernetes (On-Premise 구축, EKS 운영)
          * **GitOps & CI/CD:** GitHub Actions (OIDC 연동), ArgoCD (App-of-Apps 패턴)
          * **Configuration & Secret:** Kustomize(Base/Overlay 전략), Bitnami Sealed Secrets

      - layout: left
        title: Observability & Performance
        description: |
          * **Observability:** Prometheus, Grafana (커스텀 메트릭 및 대시보드 구축)
          * **Performance Test:** k6 (시나리오 기반 부하/스트레스 테스트)

      - layout: left
        title: Backend Engineering
        description: |
          * **Language & Framework:** Java, Spring Boot
          * **Database:** MySQL, MongoDB
          * **Data Access:** JPA/Hibernate, QueryDSL
          * **Caching & Concurrency:** Redis (분산 락, 세션 클러스터링)
          * **Messaging:** Apache Kafka (이벤트 기반 아키텍처)
          * **Security & Routing:** Spring Security, Spring Cloud Gateway


