                <li><b>[Cache Stampede 최적화]</b> 대용량 메인 상품 인덱스 조회 중 캐시 만료 시 다수의 스레드가 DB 인프라로 동시 격돌해 병목을 유발하는 Cache Stampede 결함을 테스트 코드로 정밀 분석, Redis TTL 만료 연장 분산(Jitter 기술) 아키텍처 전략을 구현하여 TPS 가용 인프라 한계 고도화</li>
